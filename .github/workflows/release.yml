name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Windows project files
        run: flutter create --platforms=windows .
      - name: Apply Everything Bar name
        shell: pwsh
        run: ./brand_windows.ps1
      - name: Build
        run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\HomeShell.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: EverythingBar-Setup
          path: installer/output/EverythingBar-Setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/EverythingBar-Setup.exe
